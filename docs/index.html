<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#192026" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="式電卓">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest?v=7">
<link rel="icon" type="image/png" href="icons/icon-192.png?v=7">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=7">
<title>式が見える電卓</title>
<style>
/* 画面構成：上に履歴、その下に入力中の式、いちばん下に5×5のテンキー */
:root{
  --bg:#eef0f2; --panel:#ffffff; --key:#ffffff; --key-op:#e3e9ee; --fg:#1d2730; --muted:#6c7a86;
  --accent:#0f6e74; --accent-fg:#ffffff; --ghost:#b6c0c8; --err:#b3412c; --line:#d6dde3; --ref-bg:#dcefef;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:"Hiragino Sans","Hiragino Kaku Gothic ProN",system-ui,"Noto Sans JP",sans-serif;
  color-scheme:light;
  /* 画面の上下の安全領域（ノッチやホームバー）を避ける */
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root{
  --bg:#12171b; --panel:#192026; --key:#1f272e; --key-op:#28323a; --fg:#e7edf1; --muted:#8d9aa5;
  --accent:#2fa7ac; --accent-fg:#06191a; --ghost:#4a5761; --err:#ef8a74; --line:#2a343c; --ref-bg:#173a3c; color-scheme:dark}}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
/* ページ全体はスクロールさせない。上下の余白は、上を表示部分、下をテンキーの帯の色で塗る */
html{height:100%;overflow:hidden;overscroll-behavior:none;background:linear-gradient(to bottom,var(--panel) 50%,var(--bg) 50%)}
body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:var(--panel);color:var(--fg);
  font:14px/1.5 var(--sans);-webkit-text-size-adjust:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.app{height:100%;max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:4px;padding-block:12px 16px}
.screen{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;padding:8px 0}

/* 履歴 */
.history{flex:1 1 0;min-height:0;overflow-y:auto;margin-inline:-4px;display:flex;flex-direction:column;gap:6px;
  font-family:var(--mono);font-size:20px;color:var(--muted);text-align:right}
.history>.row:first-child{margin-top:auto}
.history .row{border-radius:8px;padding:2px 4px;cursor:pointer}
.history .row.editing{background:var(--ref-bg);color:var(--fg)}
.history .ex{appearance:none;background:none;border:0;margin:0;padding:0;font:inherit;color:inherit;text-align:right;cursor:pointer;overflow-wrap:anywhere}
.history .tail{display:inline-block;white-space:nowrap;max-width:100%}
.history .ans{appearance:none;border:1px solid var(--line);background:var(--key-op);color:var(--fg);font:400 20px var(--mono);
  display:inline-block;line-height:1.3;border-radius:7px;padding:0 6px;cursor:pointer}
.history .ans:active{filter:brightness(.92)}
.history .ans.off{opacity:.45;cursor:default}
.history .ans.bad{color:var(--err);font-family:var(--sans);font-size:15px;cursor:default}
.history .row.changed .ans{animation:flash 1.4s ease-out}
@keyframes flash{0%,30%{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}}
.ref{display:inline-block;line-height:1.3;background:var(--ref-bg);color:var(--accent);
  border:1px solid transparent;border-radius:7px;padding:0 6px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* 式のラベルと編集中のボタン */
.label{font-size:12px;letter-spacing:.08em;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px;height:30px}
.label.editing #exprLabel{color:var(--accent);font-weight:700}
.lab-right{display:flex;align-items:center;gap:8px}
#parenInfo.warn{color:var(--err);letter-spacing:0}
.editbar{display:flex;align-items:center;gap:6px}
.editbar button{appearance:none;border:1px solid var(--line);background:var(--key-op);color:var(--fg);border-radius:10px;
  height:28px;padding:0 12px;line-height:1;font:700 13px var(--sans);cursor:pointer}
.editbar .del{background:var(--err);border-color:var(--err);color:var(--panel)}

/* 入力中の式 */
.expr{flex:none;cursor:text;max-height:40%;overflow-y:auto;display:flex;flex-direction:column;justify-content:flex-end;
  font-family:var(--mono);font-size:20px;line-height:1.5;text-align:right;overflow-wrap:anywhere;
  border-top:1px solid var(--line);padding-top:8px}
.expr .line{display:block}
.expr .ghost{color:var(--ghost)}
.expr .tok{border-radius:4px}
.expr .tok.sel{background:var(--ref-bg);outline:2px solid var(--accent);outline-offset:0}
.expr .tok.sel .ref{background:none}
.expr .cur{display:inline-block;width:2px;height:1.05em;background:var(--accent);vertical-align:-2px;margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.result{font-weight:500;color:var(--muted)}
.result.err{color:var(--err);font-family:var(--sans);font-size:15px;margin-left:8px}

/* テンキー：グレーの帯にして、画面の左右と下の端まで広げる */
.keyarea{display:flex;flex-direction:column;touch-action:none;flex:none;padding-top:2px;
  background:var(--bg);box-shadow:0 0 0 100vmax var(--bg);clip-path:inset(0 -100vmax -100vmax -100vmax)}
.grip{height:18px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.grip::before{content:"";width:44px;height:5px;border-radius:3px;background:var(--ghost)}
.keys-wrap{display:grid;grid-template-rows:1fr;transition:grid-template-rows .28s ease,opacity .2s ease}
.keys-wrap.hidden{grid-template-rows:0fr;opacity:0}
.keys-wrap.hidden>.keys{padding-block:0}
body.keys-hidden .expr,body.keys-hidden .label{touch-action:none}
.keys{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;min-height:0;overflow:hidden;padding:2px}
.keys button{appearance:none;border:1px solid var(--line);background:var(--key);color:var(--fg);border-radius:16px;
  height:clamp(42px,6.8vh,54px);font-family:var(--mono);font-size:21px;cursor:pointer;touch-action:manipulation;transition:transform .06s,filter .06s}
.keys button:active{transform:scale(.95);filter:brightness(.92)}
.keys .op{background:var(--key-op);font-size:23px}
.keys .zeros{font-size:18px}
.keys .small{font-size:19px}
.keys .fn{background:var(--key-op);font-family:var(--sans);font-size:16px;font-weight:700;color:var(--muted)}
.keys .eq{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-size:25px}
.keys svg{width:26px;height:26px;display:block;margin:auto}
@media (prefers-reduced-motion:reduce){.expr .cur,.history .row.changed .ans{animation:none}.keys-wrap{transition:none}}

/* 履歴をすべて消す確認 */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(10,16,20,.45);display:flex;align-items:center;justify-content:center;padding:24px}
.dialog{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:18px;padding:20px;width:100%;max-width:320px;
  display:flex;flex-direction:column;gap:8px;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.m-title{margin:0;font-size:17px;font-weight:700}
.m-body{margin:0;color:var(--muted);line-height:1.6}
.m-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.m-actions button{appearance:none;border:1px solid var(--line);background:var(--key-op);color:var(--fg);border-radius:12px;height:44px;
  font:700 15px var(--sans);cursor:pointer}
.m-actions .danger{background:var(--err);border-color:var(--err);color:var(--panel)}
</style>
</head>
<body>
<div class="app">
  <section class="screen">
    <div class="history" id="history"></div>
    <div class="label"><span id="exprLabel">式</span><span class="lab-right"><span id="parenInfo"></span><span class="editbar" id="editBar" hidden><button class="del" id="e-del">行を削除</button><button id="e-cancel">やめる</button></span></span></div>
    <div class="expr" id="expr" aria-live="polite"><span class="line"><span id="exprText"></span><span class="result" id="result"></span></span></div>
  </section>
  <div class="keyarea" id="keyarea">
    <div class="grip" id="grip" role="button" tabindex="0" aria-label="テンキーを隠す"></div>
    <div class="keys-wrap" id="keysWrap">
      <div class="keys" id="keys">
        <button class="fn" data-k="C">AC</button>
        <button class="fn" data-k="⌫" aria-label="1文字消す"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M9 5h10a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-6.5-7z"/><path d="M12 9.5l5 5M17 9.5l-5 5"/></svg></button>
        <button class="op" data-k="(">(</button>
        <button class="op" data-k=")">)</button>
        <button class="op" data-k="÷">÷</button>
        <button class="op small" data-k="%">%</button>
        <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
        <button class="op" data-k="×">×</button>
        <button class="op small" data-k="±" aria-label="符号を切り替える">±</button>
        <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
        <button class="op" data-k="−">−</button>
        <span aria-hidden="true"></span>
        <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
        <button class="op" data-k="+">+</button>
        <button class="zeros" data-k="000">000</button>
        <button class="zeros" data-k="00">00</button>
        <button data-k="0">0</button>
        <button data-k=".">.</button>
        <button class="eq" data-k="=">=</button>
      </div>
    </div>
  </div>
</div>

<div class="scrim" id="modal" hidden>
  <div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="m-title" aria-describedby="m-body">
    <p class="m-title" id="m-title">履歴をすべて消しますか？</p>
    <p class="m-body" id="m-body"></p>
    <div class="m-actions">
      <button id="m-cancel">キャンセル</button>
      <button id="m-ok" class="danger">履歴を消す</button>
    </div>
  </div>
</div>

<script>
/* 式の中で過去の答えは「[行ID]」という参照として持つ。
   行を編集すると、その答えを参照している行を上から順に計算し直す。 */
const OPS = ["+","−","×","÷"];
const LIMIT = 200;
const STORE = "calc-history-v2";
let expr = "";          // 入力中の式
let pos = 0;            // カーソル位置
let sel = null;         // 選択中の数字 {a,b}
let done = false;       // ＝を押した直後か
let lastId = null;      // 直前に確定した行
let history = [];       // {id, e:式, v:答え}
let nextId = 1;
let editing = null;     // 編集中の行のID
let historyDirty = true;   // 履歴の表示を描き直す必要があるか
let scrollToEnd = true;    // 新しい行が増えたときだけ、履歴をいちばん下まで送る
const flash = new Set();   // 再計算で答えが変わった行

const $ = id => document.getElementById(id);
const el = { history:$("history"), expr:$("expr"), exprText:$("exprText"), result:$("result"), label:$("exprLabel"),
  parenInfo:$("parenInfo"), editBar:$("editBar"), modal:$("modal"), keyarea:$("keyarea"), keysWrap:$("keysWrap"), grip:$("grip") };
const isDigit = c => c>="0" && c<="9";
const endsOperand = c => isDigit(c) || c===")" || c==="]" || c==="." || c==="%";
const opens = s => { let n=0; for(const c of s){ if(c==="(") n++; else if(c===")") n--; } return n; };
const byId = id => history.find(h=>h.id===id);
const idxOf = id => history.findIndex(h=>h.id===id);

/* ---- 保存（この端末のブラウザ内） ---- */
function save(){ try{ localStorage.setItem(STORE, JSON.stringify({nextId, history})); }catch(e){} }
function load(){
  try{
    const d=JSON.parse(localStorage.getItem(STORE)||"null");
    if(d && Array.isArray(d.history)){
      history=d.history.filter(x=>x&&typeof x.e==="string"&&Number.isInteger(x.id));
      nextId=Math.max(d.nextId|0, 1, ...history.map(h=>h.id+1));
    }
  }catch(e){}
  recalc(false);
  // 上限を超えていたら古い行から消す（参照している式は数字に置き換える）
  if(history.length>LIMIT){ while(history.length>LIMIT) removeRow(history[0].id); save(); }
}

/* ---- 計算（evalは使わず、自前で式を解析） ---- */
function tokenize(s){
  const t=[]; let i=0;
  while(i<s.length){
    const c=s[i];
    if(isDigit(c)||c==="."){ let j=i; while(j<s.length&&(isDigit(s[j])||s[j]===".")) j++;
      const n=s.slice(i,j); if(n===".") throw "式が途中です"; t.push(parseFloat(n)); i=j; }
    else if(c==="["){ const j=s.indexOf("]",i); const h=byId(+s.slice(i+1,j));
      if(!h) throw "参照先がありません"; if(!isFinite(h.v)) throw "参照先がエラーです";
      t.push(h.v); i=j+1; }
    else { t.push(c); i++; }
  }
  return t;
}
function evaluate(s){
  const t=tokenize(s); let p=0;
  const expect=()=>{ if(p>=t.length) throw "式が途中です"; };
  // 足し算・引き算の右側が「10%」だけなら、左側の10%を足し引きする（200+10% = 220）
  function sum(){ let v=term().v;
    while(t[p]==="+"||t[p]==="−"){ const o=t[p++]; const r=term();
      const d = r.pct ? v*r.v : r.v;
      v = addRound(v, o==="+" ? d : -d); }
    return v; }
  // 10%×2 のように%が1つだけの項は「20%」として扱う
  function term(){ const f=factor(); let v=f.v, pcts=f.pct?1:0;
    while(true){
      let o=t[p];
      if(o==="×"||o==="÷") p++;
      else if(typeof o==="number"||o==="(") o="×";   // 2(3) や (2)(3) は掛け算とみなす
      else break;
      const r=factor(); if(r.pct) pcts++;
      if(o==="÷"&&r.v===0) throw "0では割れません";
      v = o==="×" ? v*r.v : v/r.v;
    }
    return {v, pct:pcts===1}; }
  function factor(){ const v=unary(); if(t[p]==="%"){ p++; return {v:v/100, pct:true}; } return {v, pct:false}; }
  function unary(){ expect(); if(t[p]==="−"){ p++; return -unary(); } return atom(); }
  function atom(){ expect(); const x=t[p++];
    if(typeof x==="number") return x;
    if(x==="("){ const v=sum(); if(t[p]!==")") throw "式が途中です"; p++; return v; }
    throw "式が途中です"; }
  const v=sum(); if(p!==t.length) throw "式が途中です";
  return v;
}
// 2進数の誤差を消すため、足し算・引き算の答えを元の数の桁で丸める（有効15桁）
function addRound(a,b){
  const v=a+b, m=Math.max(Math.abs(a),Math.abs(b));
  if(!isFinite(v)||m===0) return v;
  const d=14-Math.floor(Math.log10(m));
  return d<0||d>100 ? v : Number(v.toFixed(d));
}
const clean = v => parseFloat(v.toPrecision(15));
function fmt(v){
  if(!isFinite(v)) return "エラー";
  const c=clean(v), sign = c<0 ? "−" : "", a=Math.abs(c);
  if(a>=1e16||(a!==0&&a<1e-9)) return sign+a.toExponential(6).replace("e+","e").replace(/\.?0+e/,"e");
  return sign+a.toLocaleString("en-US",{maximumSignificantDigits:15});
}
// 式に書ける形の数字（マイナスは括弧付き）
function numLit(v){
  const s=Math.abs(clean(v)).toLocaleString("en-US",{useGrouping:false,maximumSignificantDigits:15});
  return v<0 ? "(−"+s+")" : s;
}
// 途中の式から、計算できる形を作る：末尾の演算子などを外し、閉じ括弧を補う
function complete(s){
  while(/[+−×÷(.]$/.test(s)) s=s.slice(0,-1);
  return s ? s+")".repeat(Math.max(0,opens(s))) : "";
}

/* ---- 履歴の再計算・追加・削除 ---- */
function recalc(mark){
  for(const h of history){
    const old=h.v; let v;
    try{ v=evaluate(h.e); }catch(e){ v=NaN; }
    h.v = isFinite(v) ? v : NaN;
    if(mark && !Object.is(old,h.v)) flash.add(h.id);
  }
  historyDirty=true;
}
// 消える行を参照している式は、その時点の数字に置き換える
function freeze(id){
  const h=byId(id); if(!h||!isFinite(h.v)) return;
  const lit=numLit(h.v), tag="["+id+"]";
  for(const x of history) if(x.id!==id) x.e=x.e.split(tag).join(lit);
  if(expr.includes(tag)) setExpr(expr.split(tag).join(lit));
}
function removeRow(id){ freeze(id); const i=idxOf(id); if(i>=0) history.splice(i,1); historyDirty=true; }
function pushRow(e,v){
  const id=nextId++;
  history.push({id,e,v});
  while(history.length>LIMIT) removeRow(history[0].id);
  historyDirty=true; scrollToEnd=true;
  return id;
}

/* ---- 入力ルール（カーソル位置 pos、選択中の数字 sel） ---- */
function setExpr(v){ expr=v; pos=v.length; sel=null; }
function press(k){
  if(!el.modal.hidden) return;
  // 入力欄が空のときのACは、履歴をすべて消す確認を出す（行の編集中は除く）
  if(k==="C" && expr==="" && editing===null && history.length){ openModal(); return; }
  if(k==="=") return equals();
  if(k==="C"){ setExpr(""); done=false; return render(); }
  if(done){
    // ＝の直後に演算子・%・±を押すと、直前の答えを参照して続ける
    if((OPS.includes(k)||k==="%"||k==="±") && expr==="" && byId(lastId)) setExpr("["+lastId+"]");
    done=false;
  }
  if(k==="±"){ toggleSign(); return render(); }
  let b, a;
  if(sel){
    // 選択中の数字は、数字を打つと置き換わり、⌫で丸ごと消える
    const replace = isDigit(k)||k==="."||k==="⌫";
    b=expr.slice(0, replace ? sel.a : sel.b); a=expr.slice(sel.b); sel=null;
    if(k==="⌫"){ expr=b+a; pos=b.length; return render(); }
  } else { b=expr.slice(0,pos); a=expr.slice(pos); }
  // 00・000 は 0 を続けて打ったのと同じ
  const nb = k==="00"||k==="000" ? [...k].reduce((acc,c)=> acc===null ? null : applyKey(acc,a,c), b) : applyKey(b,a,k);
  if(nb!==null){ expr=nb+(k==="⌫"?"":joinRight(nb,a))+a; pos=nb.length; }
  render();
}
// カーソルより前の部分 b に、キー k を打ったときの新しい b を返す（何もしないなら null）
function applyKey(b,a,k){
  const L=b.slice(-1);
  const curNum=()=>b.match(/[0-9.]*$/)[0];
  if(isDigit(k)||k==="."){
    if(L===")"||L==="]"||L==="%") b+="×";
    if(k==="."){
      if((curNum()+a.match(/^[0-9.]*/)[0]).includes(".")) return null;
      return b+(curNum()===""?"0.":".");
    }
    if(curNum()==="0") b=b.slice(0,-1);   // 先頭の0を置き換え
    return b+k;
  }
  if(OPS.includes(k)){
    if(b===""||L==="(") return k==="−" ? b+"−" : null;  // 先頭・括弧の直後はマイナスだけ
    if(L===".") b=b.slice(0,-1);
    if(OPS.includes(b.slice(-1))){
      if(b.length===1||b.slice(-2,-1)==="(") return null;   // 「(−」の−は置き換えない
      b=b.slice(0,-1);
    }
    return b+k;
  }
  if(k==="%"){
    if(b===""||L==="("||L==="%"||OPS.includes(L)) return null;
    return (L==="." ? b.slice(0,-1) : b)+"%";
  }
  if(k==="("){
    if(endsOperand(L)) b=(L==="." ? b.slice(0,-1) : b)+"×";
    return b+"(";
  }
  if(k===")"){
    if(opens(b)<=0||L==="("||OPS.includes(L)) return null;
    return (L==="." ? b.slice(0,-1) : b)+")";
  }
  if(k==="⌫") return L==="]" ? b.replace(/\[\d+\]$/,"") : b.slice(0,-1);
  return null;
}
// カーソルの右側との間に、必要なら×を補う
function joinRight(b,a){
  const L=b.slice(-1), R=a.charAt(0);
  if((L===")"||L==="]"||L==="%") && (isDigit(R)||R==="."||R==="("||R==="[")) return "×";
  if((isDigit(L)||L===".") && (R==="("||R==="[")) return "×";
  return "";
}
// ± ：カーソルのある数字（または選択中の数字）の符号を切り替える
function toggleSign(){
  let q=pos;
  if(!sel && expr[q-1]===")" && /\(−([0-9.]+|\[\d+\])%?\)$/.test(expr.slice(0,q))) q--;   // (−5) の直後
  if(!sel && expr[q-1]==="%") q--;
  const tk = sel || exprTokens(expr).find(t=>(t.k==="num"||t.k==="ref") && t.a<q && q<=t.b);
  if(!tk){
    // 数字を打つ前なら、マイナスの数を打ち始める
    const b=expr.slice(0,pos), a=expr.slice(pos), L=b.slice(-1);
    if(b===""||L==="("){ expr=b+"−"+a; pos=b.length+1; }
    else if(OPS.includes(L)){ expr=b+"(−"+a; pos=b.length+2; }
    return;
  }
  const X=expr.slice(tk.a,tk.b), pre=expr.slice(0,tk.a), post=expr.slice(tk.b);
  let na, wrapped=false;
  if(pre.endsWith("(−") && post.startsWith(")")){ expr=pre.slice(0,-2)+X+post.slice(1); na=tk.a-2; }
  else if(pre.endsWith("−") && (pre.length===1 || pre.slice(-2,-1)==="(")){ expr=pre.slice(0,-1)+X+post; na=tk.a-1; }
  else if(pre===""||pre.endsWith("(")){ expr=pre+"−"+X+post; na=tk.a+1; }
  else { expr=pre+"(−"+X+")"+post; na=tk.a+2; wrapped=true; }
  const end=na+X.length;
  if(sel){ sel={a:na,b:end}; pos=end; }
  else pos = end + (wrapped?1:0) + (expr[end+(wrapped?1:0)]==="%" && q<pos ? 1 : 0);
}
function equals(){
  sel=null;
  const s=complete(expr);
  if(!s) return;
  let v; try{ v=evaluate(s); }catch(e){ showError(e); return; }
  if(!isFinite(v)){ showError("桁が大きすぎます"); return; }
  let id;
  if(editing!==null){
    const h=byId(editing); h.e=s; id=h.id; editing=null;
    recalc(true); flash.add(id);
  } else {
    id=pushRow(s,v);
  }
  save();
  setExpr(""); lastId=id; done=true;
  render();
}
function showError(msg){ el.result.className="result err"; el.result.textContent=msg; }

/* ---- 行の編集 ---- */
function startEdit(id){ editing=id; setExpr(byId(id).e); done=false; historyDirty=true; render(); }
function cancelEdit(){ editing=null; setExpr(""); done=false; historyDirty=true; render(); }
function deleteEditing(){
  const id=editing; editing=null; removeRow(id); recalc(true); save();
  setExpr(""); done=false; render();
}
// 過去の答えを参照として式に入れる（編集中は、その行より上の答えだけ）
function insertRef(id){
  done=false;
  let b,a;
  if(sel){ b=expr.slice(0,sel.a); a=expr.slice(sel.b); sel=null; } else { b=expr.slice(0,pos); a=expr.slice(pos); }
  const L=b.slice(-1);
  if(endsOperand(L)) b=(L==="." ? b.slice(0,-1) : b)+"×";
  b+="["+id+"]"; expr=b+joinRight(b,a)+a; pos=b.length; render();
}

/* ---- 表示 ---- */
const esc = s => s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function refHtml(id){ const h=byId(id); return `<span class="ref">${h&&isFinite(h.v)?fmt(h.v):"?"}</span>`; }
const pretty = s => esc(s).replace(/\[(\d+)\]/g,(m,id)=>refHtml(+id));
function exprTokens(s){
  const t=[]; let i=0;
  while(i<s.length){ const c=s[i];
    if(isDigit(c)||c==="."){ let j=i; while(j<s.length&&(isDigit(s[j])||s[j]===".")) j++; t.push({k:"num",a:i,b:j}); i=j; }
    else if(c==="["){ const j=s.indexOf("]",i)+1; t.push({k:"ref",a:i,b:j}); i=j; }
    else { t.push({k:"sym",a:i,b:i+1}); i++; }
  }
  return t;
}
function liveExprHtml(){
  const cur='<span class="cur"></span>';
  let html = (!sel && pos===0) ? cur : "";
  for(const tk of exprTokens(expr)){
    const txt=expr.slice(tk.a,tk.b);
    const inner = tk.k==="ref" ? refHtml(+txt.slice(1,-1))
      : (!sel && pos>tk.a && pos<tk.b) ? esc(txt.slice(0,pos-tk.a))+cur+esc(txt.slice(pos-tk.a))
      : esc(txt);
    const on = sel && sel.a===tk.a && sel.b===tk.b;
    html+=`<span class="tok k-${tk.k}${on?" sel":""}" data-a="${tk.a}" data-b="${tk.b}">${inner}</span>`;
    if(!sel && pos===tk.b && pos>0) html+=cur;
  }
  return html;
}
// 履歴は、内容や編集状態が変わったときだけ描き直す
function renderHistory(){
  const editIdx = editing===null ? history.length : idxOf(editing);
  el.history.innerHTML=history.map((x,i)=>{
    const ans = !isFinite(x.v) ? `<span class="ans bad">エラー</span>`
      : i<editIdx ? `<button class="ans" data-id="${x.id}" aria-label="${fmt(x.v)} を式に入れる">${fmt(x.v)}</button>`
      : `<span class="ans off">${fmt(x.v)}</span>`;
    const cls = "row"+(x.id===editing?" editing":"")+(flash.has(x.id)?" changed":"");
    return `<div class="${cls}" data-id="${x.id}"><button class="ex" aria-label="この行を編集">${pretty(x.e)}</button><span class="tail">=${ans}</span></div>`;
  }).join("");
  flash.clear();
  if(scrollToEnd){ el.history.scrollTop=el.history.scrollHeight; scrollToEnd=false; }
  el.editBar.hidden = editing===null;
  el.label.textContent = editing===null ? "式" : "行を編集";
  el.label.parentNode.classList.toggle("editing", editing!==null);
  historyDirty=false;
}
function render(){
  if(historyDirty) renderHistory();
  if(pos>expr.length||pos<0) pos=expr.length;
  const open=opens(expr);
  el.exprText.innerHTML = liveExprHtml() + `<span class="ghost">${")".repeat(Math.max(0,open))}</span>`;
  if(pos===expr.length) el.expr.scrollTop = el.expr.scrollHeight;
  const full = editing===null && expr!=="" && history.length>=LIMIT;
  el.parenInfo.textContent = full ? `上限${LIMIT}件です。確定すると最古の行が消えます。`
    : open>0 ? `閉じていない括弧 ${open}` : "";
  el.parenInfo.classList.toggle("warn", full);
  // 途中の式でも答えを先に見せる
  const s=complete(expr);
  let v=null; if(s){ try{ v=evaluate(s); }catch(e){ v=e; } }
  if(v==="0では割れません") showError(v);
  else { el.result.className="result"; el.result.textContent = typeof v==="number" ? "="+fmt(v) : ""; }
}

/* ---- 全消去の確認 ---- */
function openModal(){
  $("m-body").textContent=`${history.length}件の計算履歴が消えます。元には戻せません。`;
  el.modal.hidden=false; $("m-cancel").focus();
}
const closeModal = () => { el.modal.hidden=true; };
$("m-cancel").addEventListener("click",closeModal);
$("m-ok").addEventListener("click",()=>{ history=[]; editing=null; historyDirty=true; save(); setExpr(""); done=false; closeModal(); render(); });
el.modal.addEventListener("click",e=>{ if(e.target===el.modal) closeModal(); });

/* ---- 操作 ---- */
el.history.addEventListener("click",e=>{
  const a=e.target.closest("button.ans"); if(a){ insertRef(+a.dataset.id); return; }
  const x=e.target.closest(".row"); if(x) startEdit(+x.dataset.id);
});
// 式をタップ：数字（参照）は選択、記号はその前後にカーソル、余白は先頭か末尾へ
el.expr.addEventListener("click",e=>{
  if(!el.modal.hidden||suppressClick) return;
  if(keysHidden) setKeys(false);    // 隠れているときに式をタップしたらテンキーを戻す
  done=false;
  const t=e.target.closest(".tok");
  if(t){
    const a=+t.dataset.a, b=+t.dataset.b;
    if(t.classList.contains("k-sym")){
      const r=t.getBoundingClientRect(); sel=null; pos = e.clientX < r.left+r.width/2 ? a : b;
    } else if(sel && sel.a===a && sel.b===b){ sel=null; pos=b; }
    else { sel={a,b}; pos=b; }
  } else {
    const r=el.exprText.querySelector(".tok")?.getBoundingClientRect();
    pos = (r && e.clientX<r.left && e.clientY<r.bottom) ? 0 : expr.length;
    sel=null;
  }
  render();
});
$("e-cancel").addEventListener("click",cancelEdit);
$("e-del").addEventListener("click",deleteEditing);
$("keys").addEventListener("click",e=>{ if(suppressClick) return; const b=e.target.closest("button"); if(b) press(b.dataset.k); });
document.addEventListener("keydown",e=>{
  if(!el.modal.hidden){ if(e.key==="Escape") closeModal(); return; }
  const map={"+":"+","-":"−","*":"×","/":"÷","%":"%","Enter":"=","=":"=","Backspace":"⌫","Escape":"C","(":"(",")":")",".":"."};
  const k = e.key.length===1&&isDigit(e.key) ? e.key : map[e.key];
  if(k){ e.preventDefault(); press(k); }
});

/* ---- テンキーを隠す・戻す ---- */
let keysHidden=false, suppressClick=false, drag=null, keysH=0;
function setKeys(hide){
  if(hide && el.keysWrap.offsetHeight>0) keysH=el.keysWrap.offsetHeight;   // 出すときに使う高さを覚えておく
  keysHidden=hide;
  el.keysWrap.classList.toggle("hidden",hide);
  document.body.classList.toggle("keys-hidden",hide);
  el.grip.setAttribute("aria-label", hide ? "テンキーを出す" : "テンキーを隠す");
}
function blockClick(){ suppressClick=true; setTimeout(()=>{ suppressClick=false; },350); }
// テンキーを指に合わせて動かす。出ているときは下へ、隠れているときは上へ。
// 離した位置と速さで、切り替えるか元に戻すかを決める
function startDrag(e){
  const show=keysHidden;
  drag={x:e.clientX, y:e.clientY, py:e.clientY, pt:performance.now(), vy:0, show, active:false,
    H: show ? (keysH || $("keys").scrollHeight+4) : el.keysWrap.offsetHeight};
}
el.keyarea.addEventListener("pointerdown",startDrag);
// 隠れているときは、式の欄とラベルからも引き上げられる
for(const t of [el.expr, document.querySelector(".label")]) t.addEventListener("pointerdown",e=>{ if(keysHidden) startDrag(e); });
addEventListener("pointermove",e=>{
  if(!drag) return;
  const dir=drag.show?-1:1, along=(e.clientY-drag.y)*dir, dx=e.clientX-drag.x, w=el.keysWrap;
  if(!drag.active){
    if(along>10 && along>Math.abs(dx)*1.5){
      drag.active=true; w.style.transition="none";
      if(drag.show){ w.style.height="0px"; w.classList.remove("hidden"); }
    }
    else if(Math.abs(dx)>14||along<-14) drag=null;
    if(!drag||!drag.active) return;
  }
  const now=performance.now();
  drag.vy=(e.clientY-drag.py)*dir/Math.max(1,now-drag.pt); drag.py=e.clientY; drag.pt=now;
  const moved=Math.min(drag.H, Math.max(0,along));
  w.style.height=(drag.show ? moved : drag.H-moved)+"px";
});
function endDrag(e, cancel){
  const d=drag; drag=null;
  if(!d||!d.active) return;
  blockClick();
  const along=(e.clientY-d.y)*(d.show?-1:1);
  const toggle=!cancel && (along>d.H*0.35 || d.vy>0.5);
  const hide = d.show ? !toggle : toggle;
  const w=el.keysWrap;
  w.style.transition="height .2s ease-out";
  void w.offsetHeight;
  w.style.height = hide ? "0px" : d.H+"px";
  let finished=false;
  const finish=()=>{
    if(finished) return; finished=true;
    w.style.transition="none";
    setKeys(hide);
    w.style.height="";
    void w.offsetHeight;
    w.style.transition="";
  };
  w.addEventListener("transitionend",finish,{once:true});
  setTimeout(finish,260);
}
addEventListener("pointerup",e=>endDrag(e,false));
addEventListener("pointercancel",e=>endDrag(e,true));
el.grip.addEventListener("click",()=>{ if(!suppressClick) setKeys(!keysHidden); });
el.grip.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); setKeys(!keysHidden); } });

load();
render();

// オフラインでも起動できるように、ファイルを端末に保存する仕組みを登録する
if("serviceWorker" in navigator) addEventListener("load",()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); });
</script>
</body>
